[package]
name = "rgt-interfaces"
version = "0.12.0"
description = "Collection of the standard RGT smart contract interface"
keywords = ["tondi", "rgt", "smart-contracts"]
categories = ["cryptography::cryptocurrencies"]
authors = ["Dr Maxim Orlovsky <orlovsky@lnp-bp.org>"]
rust-version = "1.81.0"
edition = "2021"
license = "Apache-2.0"
readme = "README.md"

[[bin]]
name = "rgt-interfaces-stl"
required-features = ["stl"]

[lib]
name = "rgt_interfaces"

[dependencies]
rgt-core = { workspace = true, features = ["stl"] }
amplify = "4.9.0"
strict_encoding = "~2.9.1"
strict_types = "~2.9.0"
commit_verify = { version = "0.12.0", features = ["stl"] }
serde = { version = "1.0", optional = true, features = ["derive"] }
serde_with = "1.14"

[features]
default = []
all = ["stl", "serde"]
stl = ["strict_types/armor"]
serde = ["rgt-core/serde", "dep:serde", "strict_encoding/serde", "commit_verify/serde"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
rand = { version = "0.9.1", optional = true }
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom2 = { package = "getrandom", version = "0.2", features = ["js"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.docs.rs]
features = ["all"]
