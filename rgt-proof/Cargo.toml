[package]
name = "rgt-proof"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Recursive RGT proofs and certified offline deliveries"

[dependencies]
anyhow = "1"
bincode = "1.3"
clap = { version = "4", features = ["derive"] }
hex.workspace = true
rgt-lineage = { path = "../rgt-lineage" }
rgt-runtime.workspace = true
rgt-std = { workspace = true, features = ["serde"] }
risc0-binfmt = "3.0.6"
risc0-zkos-v1compat = "2.2.3"
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["client", "disable-dev-mode"] }
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
tondi-consensus-core.workspace = true
tondi-vm.workspace = true
