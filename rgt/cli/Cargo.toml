[package]
name = "rgt-wallet"
description = "RGT smart contracts command-line wallet"
version = "0.12.0-rc.3"
authors = ["Dr Maxim Orlovsky <orlovsky@lnp-bp.org>"]
keywords = ["tondi", "rgt", "smart-contracts"]
readme = "../README.md"
license = "Apache-2.0"
edition = "2021"
rust-version.workspace = true

[[bin]]
path = "src/main.rs"
name = "rgt"

[dependencies]
rgt-runtime.workspace = true
anyhow = "1"
clap = { version = "4", features = ["derive"] }
