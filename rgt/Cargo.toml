[package]
name = "rgt-runtime"
version = "0.12.0-rc.3"
edition = "2021"
rust-version = "1.95"
license.workspace = true
description = "RGT Note seals and certified transfer verification for Tondi v10"

[dependencies]
anyhow = "1"
amplify.workspace = true
clap = { version = "4", features = ["derive"] }
hex.workspace = true
rand.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rgt-std = { workspace = true, features = ["binfile", "serde"] }
rgt-persist-fs.workspace = true
strict_types.workspace = true
strict_encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
tondi-vm.workspace = true
tondi-consensus-core.workspace = true
tondi-consensus = { path = "../../Tondi/consensus", version = "=1.23.0" }
tondi-wallet-pstt.workspace = true

aes-gcm = "0.10"
hkdf = "0.12"
sha2.workspace = true
bip39 = "2.2"
zeroize = "1"
secp256k1 = { version = "0.29", features = ["global-context", "rand-std"] }

rgt-lineage = { path = "../rgt-lineage" }
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["std", "disable-dev-mode"] }
bincode = "1.3"

[target.'cfg(any(target_os = "linux", target_vendor = "apple"))'.dependencies]
rustix = { version = "1", features = ["fs"] }
